    <div class="photo-despiece" id="photoDespiece" hidden>
      <div class="despiece-toolbar">
        <button type="button" id="despieceExplode" aria-pressed="true">Separar</button>
        <p class="despiece-hint">Toca una parte para capturar nombre, detalle, color y precio</p>
      </div>
      <div class="despiece-board" id="despieceBoard">
        <svg id="despieceSvg" class="despiece-svg" viewBox="0 0 800 920" role="img" aria-label="Despiece de la prenda. Cada parte es seleccionable."></svg>
        <div class="despiece-hits" id="despieceHits" aria-label="Partes de la prenda"></div>
      </div>
      <aside class="despiece-dock" id="despieceDock" aria-live="polite">
        <div class="despiece-dock-head">
          <span class="despiece-kicker">Parte seleccionada</span>
          <strong id="despiecePartName">Cuerpo</strong>
        </div>
        <div class="field"><label for="despiecePartLabel">Nombre / etiqueta</label><input id="despiecePartLabel" type="text" autocomplete="off" maxlength="80" placeholder="Nombre de la parte"></div>
        <div class="field"><label for="despiecePartNotes">Detalle / notas</label><textarea id="despiecePartNotes" maxlength="400" rows="2" placeholder="Por definir"></textarea></div>
        <div class="despiece-color-row">
          <div class="field"><label for="despiecePartColor">Color</label><input id="despiecePartColor" type="color" value="#f4f3ef" aria-label="Color de la parte"></div>
          <div class="field"><label for="despiecePartHex">Hex</label><input id="despiecePartHex" type="text" maxlength="7" placeholder="Por definir" spellcheck="false" autocomplete="off"></div>
          <div class="field"><label for="despiecePartPantone">Pantone / custom</label><input id="despiecePartPantone" type="text" maxlength="40" placeholder="Ej. 19-1664 TCX" autocomplete="off"></div>
        </div>
        <div class="field"><label for="despiecePartCost">Precio de esta parte</label><input id="despiecePartCost" type="text" inputmode="decimal" autocomplete="off" maxlength="12" placeholder="Por definir" aria-describedby="despiecePartHint despiecePartError"></div>
        <p class="help" id="despiecePartHint">Precio vacío = por definir. No se inventan costos de fábrica. Color hex o Pantone, a elección.</p>
        <p class="help price-error" id="despiecePartError" role="status"></p>
        <div id="despieceArtCosts" class="despiece-arts" hidden></div>
        <div class="despiece-total"><span id="despieceTotalLabel">Total por partes</span><strong id="despieceTotalAmount">Por definir</strong><small id="despieceTotalHint">Suma de las partes visibles de esta prenda.</small></div>
      </aside>
    </div>
