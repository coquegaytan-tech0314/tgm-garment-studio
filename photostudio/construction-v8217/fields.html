<div id="hoodieStdExtras" class="hoodie-std" hidden>
  <h4>Confección TGM · hoodie / sudadera</h4>
  <p class="help">Cardigán (rib) de puño y pretina. Estándar de planta, editable por cliente.</p>
  <div class="row">
    <div class="field"><label for="hoodieCuffRib">Puño cardigán (cm a costura)</label><input id="hoodieCuffRib" data-hoodie-std="cuffRibCm" type="number" min="2" max="12" step="0.1" value="5.5"></div>
    <div class="field"><label for="hoodieWaistband">Pretina (cm a costura)</label><input id="hoodieWaistband" data-hoodie-std="waistbandCm" type="number" min="2" max="15" step="0.1" value="5.5"></div>
  </div>
  <div class="field"><label for="hoodieSeam">Costura promedio (cm)</label><input id="hoodieSeam" data-hoodie-std="seamCm" type="number" min="0.3" max="2" step="0.05" value="0.75"></div>
  <p class="help">Se ven en Regla (Logos → Acabado), Tallas, ficha y Despiece. La foto de Acabado no se pinta.</p>
</div>
