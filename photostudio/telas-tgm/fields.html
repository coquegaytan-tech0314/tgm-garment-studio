  <div class="tela-tgm">
    <h4>Catálogo TGM · tela</h4>
    <p class="help">Presets del catálogo de planta (nombres y composiciones tal cual). Puedes editar el renglón o guardar un desarrollo nuevo. No se inventan SKUs ni porcentajes que el catálogo no trae.</p>
    <div class="field"><label for="telaCatalog">Tela del pedido</label><select id="telaCatalog"></select></div>
    <div class="row">
      <div class="field"><label for="telaNombre">Nombre</label><input id="telaNombre" maxlength="70" placeholder="Nombre de catálogo o desarrollo"></div>
      <div class="field"><label for="telaGsm">Gramaje (g/m²)</label><input id="telaGsm" type="number" min="0" max="2000" step="1" placeholder="Solo si el catálogo lo trae"></div>
    </div>
    <div class="field"><label for="telaComposicion">Composición (texto de catálogo)</label><input id="telaComposicion" maxlength="120" placeholder="Ej. Poliéster/Algodón — sin % inventado"></div>
    <div class="field"><label for="telaNota">Uso / knitt / nota</label><input id="telaNota" maxlength="160" placeholder="piqué, liso, schools, warehouse…"></div>
    <button type="button" id="telaSaveCustom">Guardar como desarrollo nuevo</button>
  </div>
