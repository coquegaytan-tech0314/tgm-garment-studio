name: V8 build and validation

on:
  push:
    branches:
      - feature/v8-projects-cumbres-rhinos

permissions:
  contents: write

jobs:
  build-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip v8-build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v8-projects-cumbres-rhinos
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Build V8 standalone app
        run: npm run build

      - name: Run regression suite
        run: npm test

      - name: Verify V8 markers
        run: |
          grep -q 'ESTUDIO · v8' dist/index.html
          grep -q 'Proyecto completo' dist/index.html
          grep -q "PROJECT_SCHEMA='tgm-project'" dist/index.html

      - name: Commit generated V8 dist
        run: |
          if git diff --quiet -- dist/index.html; then
            echo 'dist/index.html is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/index.html
          git commit -m 'Build V8 standalone app [skip v8-build]'
          git push origin HEAD:feature/v8-projects-cumbres-rhinos
